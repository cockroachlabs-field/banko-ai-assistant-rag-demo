{% extends "base.html" %}

{% block title %}Choose a persona - Banko AI Assistant{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <div class="mx-auto h-12 w-12 flex items-center justify-center">
                <img src="{{ url_for('static', filename='roach-logo.svg') }}" alt="CockroachDB" class="h-12 w-12">
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                Who's banking today?
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Pick a demo persona. Every answer is scoped to their data.
            </p>
        </div>
        <form class="mt-8 space-y-3" method="POST">
            {% for p in personas %}
            <button type="submit" name="persona_id" value="{{ p.user_id }}"
                    class="group w-full flex items-center gap-4 px-4 py-3 border border-gray-300 rounded-md bg-white shadow-sm hover:border-indigo-500 hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-left">
                <span class="flex-shrink-0 h-10 w-10 rounded-full bg-indigo-600 text-white flex items-center justify-center text-lg font-semibold">
                    {{ p.name[0] }}
                </span>
                <span>
                    <span class="block text-sm font-medium text-gray-900">{{ p.name }}</span>
                    <span class="block text-xs text-gray-500">{{ p.blurb }}</span>
                </span>
            </button>
            {% endfor %}
        </form>
    </div>
</div>
{% endblock %}
